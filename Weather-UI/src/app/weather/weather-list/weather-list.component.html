<div class="weather-table-wrapper">
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="sortData($event)" class="mat-elevation-z2">
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
      <td mat-cell *matCellDef="let weather">{{ weather.date }}</td>
    </ng-container>

    <ng-container matColumnDef="minTemperature">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Min Temp</th>
      <td mat-cell *matCellDef="let weather">{{ weather.minTemperature }}°</td>
    </ng-container>

    <ng-container matColumnDef="maxTemperature">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Max Temp</th>
      <td mat-cell *matCellDef="let weather">{{ weather.maxTemperature }}°</td>
    </ng-container>

    <ng-container matColumnDef="precipitation">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Precipitation</th>
      <td mat-cell *matCellDef="let weather">{{ weather.precipitation }} mm</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
